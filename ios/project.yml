name: XGrab

options:
  bundleIdPrefix: app.xgrab
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "31"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

# App native seule : aucune extension Safari n'est embarquee. Le blocage des
# publicites passe par une liste de regles WebKit integree a l'app.
targets:

  XGrab:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
      - path: App/Resources/blockerList.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: XGrab
        PRODUCT_BUNDLE_IDENTIFIER: app.xgrab.XGrab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  XGrab:
    build:
      targets:
        XGrab: all
    run:
      config: Debug
    archive:
      config: Release