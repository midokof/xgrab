name: XGrab

options:
  bundleIdPrefix: app.xgrab
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  XGrab:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
    dependencies:
      - target: XGrabExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: XGrab
        PRODUCT_BUNDLE_IDENTIFIER: app.xgrab.XGrab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  XGrabExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - "Info.plist"
          - "Extension.entitlements"
          - "Resources"
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/background.js
        buildPhase: resources
      - path: Extension/Resources/content.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: XGrabExtension
        PRODUCT_BUNDLE_IDENTIFIER: app.xgrab.XGrab.Extension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  XGrab:
    build:
      targets:
        XGrab: all
    run:
      config: Debug
    archive:
      config: Release