name: Build iOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  KEY_ID: ${{ secrets.APPLE_KEY_ID }}

jobs:
  build:
    # Runner macOS : gratuit si le depot est public, sinon 10x la minute.
    runs-on: macos-14
    # Necessaire pour publier le journal de build dans la branche ci-log.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Sans ces secrets, le build sort un IPA non signe : installable
      # uniquement via TrollStore (iOS 17.0 - 17.4.1).
      - name: Detect signing secrets
        id: secrets
        run: |
          if [ -n "${TEAM_ID}" ] && [ -n "${KEY_ID}" ] && [ -n "${{ secrets.APPLE_KEY_P8 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the App Store Connect key
        if: steps.secrets.outputs.signed == 'true'
        env:
          KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Build (unsigned)
        if: steps.secrets.outputs.signed == 'false'
        run: |
          set -uo pipefail
          # "archive" valide systematiquement la signature. "build" passe
          # par-dessus et suffit a produire un bundle installable.
          xcodebuild build \
            -project ios/XGrab.xcodeproj \
            -scheme XGrab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 "$RUNNER_TEMP/xcodebuild.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Locate the built app
        if: steps.secrets.outputs.signed == 'false'
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "XGrab.app" | head -1)
          echo "APP=$app"
          echo "$app" > "$RUNNER_TEMP/app-path"
          ls -la "$app"

      - name: Verify the bundle metadata
        # installd refuse un bundle dont CFBundleExecutable ne correspond pas
        # a un fichier reellement present : on le verifie ici plutot que sur
        # le telephone. On verifie aussi que le blocage des publicites est bien
        # embarque et qu'aucune extension ne l'est.
        run: |
          set -euo pipefail
          app=$(cat "$RUNNER_TEMP/app-path")
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Info.plist")
          echo "CFBundleExecutable = $exe"
          test -f "$app/$exe" || { echo "EXECUTABLE ABSENT : $app/$exe"; exit 1; }

          test -f "$app/blockerList.json" \
            || { echo "LISTE DE REGLETS ABSENTE"; exit 1; }
          echo "blockerList.json = $(wc -c < "$app/blockerList.json") octets"

          if [ -d "$app/PlugIns" ]; then
            echo "ATTENTION : des extensions sont encore embarquees :"
            ls -la "$app/PlugIns"
            exit 1
          fi

          plutil -p "$app/Info.plist" | head -20

      - name: Archive (signed)
        if: steps.secrets.outputs.signed == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/XGrab.xcodeproj \
            -scheme XGrab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/XGrab.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -quiet

      - name: Export the IPA (unsigned)
        if: steps.secrets.outputs.signed == 'false'
        run: |
          set -euo pipefail
          # Un IPA est un zip dont la racine contient Payload/. On assemble
          # l'arborescence avant de compresser, sinon TrollStore refuse.
          mkdir -p "$RUNNER_TEMP/stage/Payload" "$RUNNER_TEMP/ipa"
          ditto "$(cat "$RUNNER_TEMP/app-path")" "$RUNNER_TEMP/stage/Payload/XGrab.app"
          cd "$RUNNER_TEMP/stage"
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "$RUNNER_TEMP/ipa/XGrab-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/ipa/XGrab-unsigned.ipa" | head -5

      - name: Export the IPA (signed)
        if: steps.secrets.outputs.signed == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XGrab.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Publish the build log
        # L'API des logs exige une authentification : on pousse le journal
        # dans une branche dediee pour pouvoir le lire sans jeton.
        if: always()
        run: |
          mkdir -p ci
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            cp "$RUNNER_TEMP/xcodebuild.log" ci/xcodebuild.log
          else
            { echo "LOG ABSENT dans $RUNNER_TEMP";
              ls -la "$RUNNER_TEMP"; } > ci/xcodebuild.log
          fi
          wc -c ci/xcodebuild.log
          git config user.name "ci"
          git config user.email "ci@local"
          git add -f ci/xcodebuild.log
          git commit -m "ci: journal du build" --allow-empty
          git push --force origin HEAD:refs/heads/ci-log

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: XGrab-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
