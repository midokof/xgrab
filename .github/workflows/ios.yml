name: Build iOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  KEY_ID: ${{ secrets.APPLE_KEY_ID }}

jobs:
  build:
    # Runner macOS : gratuit si le depot est public, sinon 10x la minute.
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Sans ces secrets, le build sort un IPA non signe : installable
      # uniquement via TrollStore (iOS 17.0 - 17.4.1).
      - name: Detect signing secrets
        id: secrets
        run: |
          if [ -n "${TEAM_ID}" ] && [ -n "${KEY_ID}" ] && [ -n "${{ secrets.APPLE_KEY_P8 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the App Store Connect key
        if: steps.secrets.outputs.signed == 'true'
        env:
          KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Archive (unsigned)
        if: steps.secrets.outputs.signed == 'false'
        run: |
          set -uo pipefail
          # Sans signature, il faut neutraliser aussi le style et l'equipe :
          # sinon Xcode tente de resoudre un profil de developpement et echoue
          # avec "requires a development team" avant meme de compiler.
          xcodebuild archive \
            -project ios/XGrab.xcodeproj \
            -scheme XGrab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/XGrab.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 "$RUNNER_TEMP/xcodebuild.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Archive (signed)
        if: steps.secrets.outputs.signed == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/XGrab.xcodeproj \
            -scheme XGrab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/XGrab.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -quiet

      - name: Export the IPA (unsigned)
        if: steps.secrets.outputs.signed == 'false'
        run: |
          set -euo pipefail
          # Un IPA est un zip dont la racine contient Payload/. On assemble
          # l'arborescence avant de compresser, sinon TrollStore refuse.
          mkdir -p "$RUNNER_TEMP/stage/Payload" "$RUNNER_TEMP/ipa"
          ditto "$RUNNER_TEMP/XGrab.xcarchive/Products/Applications/XGrab.app" \
            "$RUNNER_TEMP/stage/Payload/XGrab.app"
          cd "$RUNNER_TEMP/stage"
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "$RUNNER_TEMP/ipa/XGrab-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/ipa/XGrab-unsigned.ipa" | head -5

      - name: Export the IPA (signed)
        if: steps.secrets.outputs.signed == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XGrab.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Publish the build log
        # Sans authentification, l'API des logs est inaccessible : on commit
        # le journal dans le depot pour pouvoir le lire localement.
        if: always()
        run: |
          mkdir -p ci
          tail -n 400 "$RUNNER_TEMP/xcodebuild.log" > ci/xcodebuild.log 2>/dev/null \
            || echo "pas de journal" > ci/xcodebuild.log
          git config user.name "ci"
          git config user.email "ci@local"
          git add ci/xcodebuild.log
          git commit -m "ci: journal du build" || true
          git push origin HEAD:main || true

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: XGrab-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error